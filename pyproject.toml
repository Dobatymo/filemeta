[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=66.1",
]

[project]
name = "filemeta"
version = "0.0.3"
description = "functions to read file meta information"
readme = { file = "readme.md", content-type = "text/markdown" }
keywords = [
  "mp3",
]
license = { file = "LICENSE" }
authors = [
  { name = "Dobatymo" },
]
requires-python = ">=3.8"
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: ISC License (ISCL)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "anycrc>=1.3.4",
  "bitarray>=3.4.2",
  "bitstruct>=8.20",
  "genutility[exceptions,file,json]>=0.0.119",
  "importlib-resources>=5.12",
  "piexif>=1.1.3",
  "pymediainfo>=6.1",
  "requests>=2.31",
  "typing-extensions>=4.7.1",
]
optional-dependencies.heic = [
  "pi-heif",
  "pillow",
]
urls.Home = "https://github.com/Dobatymo/filemeta"

[dependency-groups]
dev = [
  "mypy>=1.14.1",
  "types-requests>=2.31.0.20231231",
]

[tool.setuptools]
packages = [
  "filemeta",
  "filemeta.data",
]
package-data.filemeta = [
  "data/*.json",
  "py.typed",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
lint.extend-select = [ "B", "I", "RUF100", "S", "UP" ]
lint.ignore = [ "B904", "S101" ]

[tool.mypy]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
allow_redefinition = true
local_partial_types = true
strict_equality = true
warn_unused_configs = true
no_implicit_optional = true
